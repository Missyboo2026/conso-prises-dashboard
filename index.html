const SOLAR=D.solar||[];
const isSolar=id=>SOLAR.indexOf(id)>=0;
const days={};       // 'YYYY-MM-DD' -> {devId: kwh}
const hours={};      // 'YYYY-MM-DD' -> {devId: {h: kwh}}
D.daily.forEach(r=>{(days[r.p]=days[r.p]||{})[r.d]=r.k});
D.hourly.forEach(r=>{const d=r.p.slice(0,10),h=+r.p.slice(11,13);(hours[d]=hours[d]||{});(hours[d][r.d]=hours[d][r.d]||{})[h]=r.k});
const allDays=Object.keys(days).sort();
let cur=allDays[allDays.length-1];
let sel="all";
let hArr=[],hBarEls=[],dArr=[],dBarEls=[],dLabels=[];

function selDev(){return sel==="all"?null:sel}
function solo(){const d=selDev();return d&&isSolar(d)}  // selection = prise solaire ?
function kwhDay(d,dev){let s=0;const o=days[d]||{};for(const k in o){if(!dev&&isSolar(k))continue;if(!dev||k===dev)s+=o[k]}return s}
function fmt(k){return (Math.round(k*100)/100).toLocaleString('fr-FR')}
function addScale(wrapEl,mx){
  wrapEl.querySelectorAll('.gline').forEach(e=>e.remove());
  [[1,'top:0',''],[0.5,'top:50%','']].forEach(function(g){
    const d=document.createElement('div');d.className='gline';d.style.cssText=g[1];
    d.innerHTML='<span>'+fmt(mx*g[0])+' kWh</span>';
    wrapEl.appendChild(d);
  });
}
function devName(id){const n=(D.devices.find(x=>x.id===id)||{name:id}).name;return isSolar(id)?'\u2600 '+n:n}

function renderSeg(){
  const s=document.getElementById('seg');s.innerHTML='';
  const mk=(id,name)=>{const b=document.createElement('button');b.textContent=name;b.className=sel===id?'on':'';b.onclick=()=>{sel=id;renderAll()};s.appendChild(b)};
  mk('all','Toutes');
  D.devices.forEach(d=>mk(d.id,d.name.length>12?d.name.slice(0,12)+'…':d.name));
}
function renderCards(){
  const dev=selDev();
  const last=allDays[allDays.length-1];
  const y=allDays[allDays.length-2];
  const m=last?last.slice(0,7):null;
  let w7=0,mk=0,top={n:null,k:0},sol7=0;
  allDays.slice(-7).forEach(d=>w7+=kwhDay(d,dev));
  allDays.forEach(d=>{if(m&&d.slice(0,7)===m)mk+=kwhDay(d,dev)});
  allDays.slice(-7).forEach(d=>{SOLAR.forEach(id=>{sol7+=((days[d]||{})[id]||0)})});
  if(!dev){
    const tot={};allDays.slice(-7).forEach(d=>{const o=days[d]||{};for(const k in o){if(isSolar(k))continue;tot[k]=(tot[k]||0)+o[k]}});
    for(const k in tot){if(tot[k]>top.k)top={n:devName(k),k:tot[k]}}
  }else{top={n:'sélection',k:w7}}
  document.getElementById('gen').textContent='Mise à jour : '+D.generated;
  document.getElementById('today').innerHTML=(last?fmt(kwhDay(last,dev)):'—')+' <small>kWh'+(solo()?' produits':'')+'</small>';
  document.getElementById('dayLab').textContent='Aujourd\u2019hui \u00b7 '+(sel==='all'?'toutes les prises (hors \u2600)':(solo()?'production solaire ':devName(sel)));
  document.getElementById('yest').innerHTML=(y?fmt(kwhDay(y,dev)):'—')+' <small>kWh'+(solo()?' produits':'')+'</small>';
  document.getElementById('w7').innerHTML=fmt(w7)+' <small>kWh</small>';
  document.getElementById('mois').innerHTML=fmt(mk)+' <small>kWh</small>';
  document.getElementById('top').innerHTML=top.n?top.n+'<br>'+fmt(top.k)+' <small>kWh</small>':'—';
  document.getElementById('sol').innerHTML=(sol7>0?fmt(sol7):'—')+' <small>kWh produits</small>';
}
function renderHours(){
  const dev=selDev();
  const o=hours[cur]||{};
  hArr=[];for(let h=0;h<24;h++){let s=0;for(const k in o){if(!dev&&isSolar(k))continue;if(!dev||k===dev)s+=(o[k][h]||0)}hArr.push(s)}
  const mx=Math.max(...hArr,0.01);
  document.getElementById('hbars').className='bars'+(solo()?' solar':'');
  const wrap=document.getElementById('hbars');wrap.innerHTML='';hBarEls=[];
  addScale(wrap,mx);
  hArr.forEach((v,h)=>{
    const c=document.createElement('div');c.className='bcol';
    const b=document.createElement('div');b.className='bar'+(!solo()&&v>mx*0.55?' hot':'');
    b.style.height=Math.max(3,Math.round(v/mx*100))+'%';
    c.appendChild(b);wrap.appendChild(c);hBarEls.push(b);
  });
  const xl=document.getElementById('hxlabs');xl.innerHTML='';
  for(let h=0;h<24;h++){const d=document.createElement('div');d.textContent=(h%3===0?h+'h':'');xl.appendChild(d)}
  const sum=hArr.reduce((a,b)=>a+b,0);
  document.getElementById('dayLabel').textContent=(cur||'—')+' \u00b7 '+fmt(sum)+' kWh'+(solo()?' produits':'');
  const pk=hArr.indexOf(Math.max(...hArr));
  document.getElementById('hnote').textContent=sum>0&&hArr[pk]>0?((solo()?'Pic de production \u00e0 ':'Pic \u00e0 ')+pk+'h'):'Aucune donn\u00e9e ce jour';
  showHour(pk);
}
function showHour(h){
  h=h<0?0:(h>23?23:h);
  hBarEls.forEach(b=>b.classList.remove('sel'));
  if(hBarEls[h])hBarEls[h].classList.add('sel');
  const v=hArr[h]||0;
  document.getElementById('hinfo').innerHTML=(v>0?fmt(v):'0')+' <small>kWh'+(solo()?' produits':'')+' \u00b7 '+h+'h \u2192 '+(h+1)+'h</small>';
}
function renderDaily(){
  const dev=selDev();
  const ds=allDays.slice(-30);
  dArr=ds.map(d=>kwhDay(d,dev));dLabels=ds;
  const mx=Math.max(...dArr,0.01);
  document.getElementById('dbars').className='dbars'+(solo()?' solar':'');
  const wrap=document.getElementById('dbars');wrap.innerHTML='';dBarEls=[];
  addScale(wrap,mx);
  dArr.forEach((v,i)=>{
    const c=document.createElement('div');c.className='bcol';
    const b=document.createElement('div');b.className='bar';
    b.style.height=Math.max(3,Math.round(v/mx*100))+'%';
    c.appendChild(b);wrap.appendChild(c);dBarEls.push(b);
  });
  const xl=document.getElementById('dxlabs');xl.innerHTML='';
  ds.forEach((d,i)=>{
    const dd=new Date(d+'T12:00:00');
    const div=document.createElement('div');div.textContent=dd.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
    div.style.fontSize=(i%3===2||i===ds.length-1)?'.58rem':'0';
    xl.appendChild(div);
  });
  showDay(dArr.length-1);
}
function showDay(i){
  i=i<0?0:(i>=dArr.length?dArr.length-1:i);
  dBarEls.forEach(b=>b.classList.remove('sel'));
  if(dBarEls[i])dBarEls[i].classList.add('sel');
  const d=dLabels[i];
  const dd=new Date(d+'T12:00:00');
  document.getElementById('dinfo').innerHTML=(dArr[i]>0?fmt(dArr[i]):'0')+' <small>kWh'+(solo()?' produits':'')+' \u00b7 '+dd.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</small>';
}
function renderTable(){
  const dev=selDev();
  const tb=document.getElementById('tbody');tb.innerHTML='';
  allDays.slice(-15).reverse().forEach(d=>{
    const o=days[d]||{};
    for(const k in o){
      if(dev&&k!==dev)continue;
      const tr=document.createElement('tr');
      const dd=new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'});
      tr.innerHTML='<td>'+dd+'</td><td'+(isSolar(k)?' class="prod"':'')+'>'+devName(k)+'</td><td class="r">'+fmt(o[k])+'</td>';
      tb.appendChild(tr);
    }
  });
  if(!tb.rows.length)tb.innerHTML='<tr><td colspan="3" style="text-align:center;color:#7b8a78">Pas encore de données</td></tr>';
}
function shiftDay(n){
  const i=allDays.indexOf(cur)+n;
  if(i>=0&&i<allDays.length){cur=allDays[i];renderHours()}
}
function bindTouch(id,fn){
  const el=document.getElementById(id);
  const hfrom=e=>{const r=el.getBoundingClientRect();return Math.floor((e.clientX-r.left)/r.width*24)};
  const dfrom=e=>{const r=el.getBoundingClientRect();return Math.floor((e.clientX-r.left)/r.width*30)};
  if(id==='hbars'){el.addEventListener('pointermove',e=>fn(hfrom(e)));el.addEventListener('pointerdown',e=>fn(hfrom(e)))}
  else{el.addEventListener('pointermove',e=>fn(dfrom(e)));el.addEventListener('pointerdown',e=>fn(dfrom(e)))}
}
bindTouch('hbars',h=>showHour(h));
bindTouch('dbars',i=>showDay(i));
function refreshPage(){location.replace(location.pathname+'?maj='+Date.now())}
function renderAll(){renderSeg();renderCards();renderHours();renderDaily();renderTable()}
renderAll();
</script>
